openapi: 3.0.3
info:
  title: Zotero Chatbox – OpenAI-compatible Contract
  version: 0.1.0
  description: |
    Contract used by the plugin to communicate with OpenAI-compatible providers.
    The plugin treats the provider endpoint as `{endpoint}` configured by the user.
servers:
  - url: https://api.openai.example
    description: Placeholder; real endpoint is user-configured
paths:
  /v1/chat/completions:
    post:
      summary: Create chat completion
      description: |
        Sends chat messages to a model. When `stream=true`, the provider emits
        `text/event-stream` with `data: {"choices":[{"delta":{"content":"..."}}]}` chunks
        and a final `data: [DONE]` sentinel.
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
      responses:
        '200':
          description: Successful completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
            text/event-stream:
              schema:
                type: string
              examples:
                sse:
                  summary: SSE stream example
                  value: |
                    data: {"id":"cmpl-...","choices":[{"delta":{"content":"Hello"}}]}
                    
                    data: {"id":"cmpl-...","choices":[{"delta":{"content":"!"}}]}
                    
                    data: [DONE]
        '400':
          description: Bad request (e.g., token limit exceeded)
        '401':
          description: Unauthorized (invalid API key)
        '429':
          description: Rate limited
        '500':
          description: Provider error
components:
  schemas:
    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
    ChatCompletionsRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        stream:
          type: boolean
          default: true
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        max_tokens:
          type: integer
          minimum: 1
    ChatChoice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/Message'
        finish_reason:
          type: string
          nullable: true
    ChatCompletionsResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatChoice'
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

