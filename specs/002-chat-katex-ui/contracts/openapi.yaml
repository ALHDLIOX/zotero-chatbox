openapi: 3.1.0
info:
  title: Chat Rendering Contracts (Internal)
  version: 0.1.0
  description: >-
    Internal contracts for formatting answers and typesetting math. These describe module
    boundaries, not an external network service.
servers:
  - url: internal://plugin
paths:
  /v1/render/markdown-to-fragments:
    post:
      summary: Parse Markdown and extract renderable fragments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/ChatMessage'
              required: [message]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fragments:
                    type: array
                    items:
                      $ref: '#/components/schemas/RenderFragment'
                required: [fragments]
  /v1/typeset/math:
    post:
      summary: Typeset a list of math segments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segments:
                  type: array
                  items:
                    $ref: '#/components/schemas/MathSegment'
              required: [segments]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rendered:
                    type: array
                    items:
                      type: object
                      properties:
                        html:
                          type: string
                        error:
                          type: string
                      additionalProperties: false
                required: [rendered]
components:
  schemas:
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
        timestamp:
          type: number
      required: [id, role, content, timestamp]
      additionalProperties: false
    MathSegment:
      type: object
      properties:
        delimiter:
          type: string
          enum: [inline-$, block-$$, inline-\(\), block-\[\]]
        content:
          type: string
        inline:
          type: boolean
        startIndex:
          type: integer
        endIndex:
          type: integer
        error:
          type: string
      required: [delimiter, content, inline, startIndex, endIndex]
      additionalProperties: false
    RenderFragment:
      type: object
      properties:
        kind:
          type: string
          enum: [text, code, math-inline, math-block]
        value:
          type: string
        source:
          type: string
      required: [kind, value]
      additionalProperties: false
