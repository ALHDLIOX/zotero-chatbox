<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <vbox id="ai-chat-provider-settings" flex="1" class="provider-settings">
    <hbox align="center" pack="start">
      <html:label
        id="ai-chat-pref-preset-label"
        for="zotero-prefpane-__addonRef__-preset"
        data-l10n-id="ai-chat-pref-preset"
      ></html:label>
      <html:select
        id="zotero-prefpane-__addonRef__-preset"
        preference="preset"
        aria-labelledby="ai-chat-pref-preset-label"
      ></html:select>
    </hbox>
    <hbox align="center" pack="start">
      <html:label
        id="ai-chat-pref-endpoint-label"
        for="zotero-prefpane-__addonRef__-endpoint"
        data-l10n-id="ai-chat-pref-endpoint"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-endpoint"
        type="text"
        readonly="true"
        disabled="true"
        aria-labelledby="ai-chat-pref-endpoint-label"
      ></html:input>
    </hbox>
    <hbox align="center" pack="start">
      <html:label
        id="ai-chat-pref-api-key-label"
        for="zotero-prefpane-__addonRef__-apiKey"
        data-l10n-id="ai-chat-pref-api-key"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-apiKey"
        type="password"
        aria-labelledby="ai-chat-pref-api-key-label"
      ></html:input>
      <html:button id="zotero-prefpane-__addonRef__-test" data-l10n-id="ai-chat-pref-test"></html:button>
    </hbox>
  </vbox>
  <html:div
    id="ai-chat-pref-error-message"
    class="provider-settings-error"
    hidden="true"
  ></html:div>
</groupbox>
