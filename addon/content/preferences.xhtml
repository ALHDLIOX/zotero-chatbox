<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <vbox id="ai-chat-provider-settings" flex="1" class="provider-settings">
    <hbox align="center" pack="start">
      <html:label
        id="ai-chat-pref-provider-label"
        for="zotero-prefpane-__addonRef__-provider"
        data-l10n-id="ai-chat-pref-provider"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-provider"
        preference="provider"
        type="text"
        aria-labelledby="ai-chat-pref-provider-label"
      ></html:input>
    </hbox>
    <hbox align="center" pack="start">
      <html:label
        id="ai-chat-pref-endpoint-label"
        for="zotero-prefpane-__addonRef__-endpoint"
        data-l10n-id="ai-chat-pref-endpoint"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-endpoint"
        preference="endpoint"
        type="text"
        aria-labelledby="ai-chat-pref-endpoint-label"
      ></html:input>
    </hbox>
    <hbox align="center" pack="start">
      <html:label
        id="ai-chat-pref-model-label"
        for="zotero-prefpane-__addonRef__-model"
        data-l10n-id="ai-chat-pref-model"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-model"
        preference="model"
        type="text"
        aria-labelledby="ai-chat-pref-model-label"
      ></html:input>
    </hbox>
    <hbox align="center" pack="start">
      <html:label
        id="ai-chat-pref-api-key-label"
        for="zotero-prefpane-__addonRef__-apiKey"
        data-l10n-id="ai-chat-pref-api-key"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-apiKey"
        preference="apiKey"
        type="password"
        aria-labelledby="ai-chat-pref-api-key-label"
      ></html:input>
    </hbox>
  </vbox>
  <html:div
    id="ai-chat-pref-error-message"
    class="provider-settings-error"
    hidden="true"
  ></html:div>
</groupbox>
