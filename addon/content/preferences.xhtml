<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<html:link rel="stylesheet" href="chrome://__addonRef__/content/global.css" />
<html:link rel="stylesheet" href="chrome://__addonRef__/content/component.css" />
<html:link rel="stylesheet" href="chrome://__addonRef__/content/preferences.css" />

<groupbox onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });">
  
  <vbox class="pref-root" flex="1">
    <!-- Top navigation -->
    <html:div class="pref-nav" role="tablist" aria-orientation="horizontal">
      <html:button
        class="pref-nav-button pref-nav-button--active"
        data-panel="basic"
        role="tab"
        data-l10n-id="zorecto-pref-nav-basic"
        aria-selected="true"
      ></html:button>
      <html:button
        class="pref-nav-button"
        data-panel="model"
        role="tab"
        data-l10n-id="zorecto-pref-nav-model"
        aria-selected="false"
      ></html:button>
    </html:div>

    <!-- Content area -->
    <vbox class="pref-content" flex="1">
      <!-- Basic panel: default chat model only -->
      <vbox id="pref-panel-basic" class="pref-panel pref-panel-basic" flex="1">
        <html:h3 class="pref-models-title" data-l10n-id="zorecto-pref-basic-title"></html:h3>

        <html:div class="pref-model-table">
          <html:div class="pref-model-table-header">
            <html:span
              class="pref-model-header-cell pref-model-header-cell--setting"
              data-l10n-id="zorecto-pref-basic-col-setting"
            ></html:span>
            <html:span
              class="pref-model-header-cell pref-model-header-cell--value"
              data-l10n-id="zorecto-pref-basic-col-value"
            ></html:span>
          </html:div>

          <html:div class="pref-model-list" role="list">
            <html:div class="pref-model-row">
              <html:div class="pref-model-cell pref-model-cell--setting">
                <html:label
                  id="pref-preset-label"
                  for="zotero-prefpane-__addonRef__-preset-button"
                  data-l10n-id="zorecto-pref-basic-default-model-label"
                ></html:label>
              </html:div>
              <html:div class="pref-model-cell pref-model-cell--value">
                <html:div
                  id="zotero-prefpane-__addonRef__-preset-root"
                  aria-labelledby="pref-preset-label"
                ></html:div>
              </html:div>
            </html:div>
          </html:div>
        </html:div>
      </vbox>

      <!-- Model settings panel -->
      <vbox id="pref-panel-model" class="pref-panel" hidden="true" flex="1">
        <html:h3 class="pref-models-title" data-l10n-id="zorecto-pref-models-title"></html:h3>

        <html:div class="pref-model-table">
          <html:div class="pref-model-table-header">
            <html:span
              class="pref-model-header-cell pref-model-header-cell--model"
              data-l10n-id="zorecto-pref-models-col-model"
            ></html:span>
            <html:span
              class="pref-model-header-cell pref-model-header-cell--provider"
              data-l10n-id="zorecto-pref-models-col-provider"
            ></html:span>
            <html:span
              class="pref-model-header-cell pref-model-header-cell--apikey"
              data-l10n-id="zorecto-pref-models-col-apikey"
            ></html:span>
          </html:div>

          <!-- Model rows (populated by script from PRESETS) -->
          <html:div id="pref-model-list" class="pref-model-list" role="list"></html:div>
        </html:div>
      </vbox>
    </vbox>
  </vbox>
</groupbox>
